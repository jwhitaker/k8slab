

- name: Check for existing Traefik TLS secret
  ansible.builtin.command: k3s kubectl -n kube-system get secret {{ cert_name }} -o name
  register: existing_tls_secret
  failed_when: false
  changed_when: false

- name: Install Traefik TLS certificates
  when: existing_tls_secret.stdout == ""
  block:
    - name: Upload TLS certificate file
      ansible.builtin.copy:
        src: "{{ tls_crt }}"
        dest: "{{ traefik_deploypath }}/tls.crt"
        mode: '0600'

    - name: Upload TLS key file
      ansible.builtin.copy:
        src: "{{ tls_key }}"
        dest: "{{ traefik_deploypath }}/tls.key"
        mode: '0600'

    - name: Create Kubernetes secret for Traefik TLS
      ansible.builtin.shell: >
        k3s kubectl create secret tls {{ cert_name }} \
          --cert={{ traefik_deploypath }}/tls.crt \
          --key={{ traefik_deploypath }}/tls.key \
          -n kube-system \
          --dry-run=client -o yaml | k3s kubectl apply -f -
      register: tls_secret_apply
      changed_when: "'created' in tls_secret_apply.stdout or 'configured' in tls_secret_apply.stdout"

